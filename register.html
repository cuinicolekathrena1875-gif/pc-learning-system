<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Hardware Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
  background: #0f172a;
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
}

/* MODAL BACKGROUND */
.modal-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FORM BOX */
.form-box {
  background: #1e293b;
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  position: relative;
  color: white;
}

/* CLOSE BUTTON */
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 18px;
  text-decoration: none;
  color: white;
}

.close-btn:hover {
  color: red;
}

/* INPUT */
input {
  background: #0f172a !important;
  color: white !important;
  border: 1px solid #334155 !important;
}

/* BUTTON */
.btn-main {
  background: #3b82f6;
  border: none;
}

.btn-main:hover {
  background: #2563eb;
}
</style>
</head>

<body>

<div class="modal-bg">
  <div class="form-box">

    <a href="index.html" class="close-btn">X</a>

    <h4 class="text-center mb-3">Create Account</h4>

    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-main w-100" onclick="register()">Register</button>

    <p class="text-center mt-3" style="font-size:12px;">
      Already have an account?
      <a href="login.html" style="color:#3b82f6;">Login</a>
    </p>

  </div>
</div>

<!-- IMPORTANT ORDER -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
async function register() {
  try {
    if (typeof supabaseClient === "undefined") {
      alert("Supabase is not connected. Check config.js");
      return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      alert("Please fill all fields");
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password
    });

    if (error) {
      alert(error.message);
      return;
    }

    const user = data.user;

    if (user) {
      const { error: insertError } = await supabaseClient
        .from("users_data")
        .insert([
          {
            id: user.id,
            email: email,
            points: 0
          }
        ]);

      if (insertError) {
        console.log(insertError);
      }
    }

    alert("Registered successfully. Check your email.");
    window.location.href = "login.html";

  } catch (err) {
    alert("Error: " + err.message);
  }
}
</script>

</body>
</html>
