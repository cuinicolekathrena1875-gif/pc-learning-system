<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Hardware Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  background: #0f172a;
  font-family: 'Segoe UI', sans-serif;
  margin: 0;
}

/* MODAL BG */
.modal-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* FORM BOX */
.form-box {
  background: #1e293b;
  padding: 25px;
  border-radius: 12px;
  width: 90%;
  max-width: 400px;
  position: relative;
  color: white;
}

/* CLOSE BUTTON */
.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 18px;
  text-decoration: none;
  color: white;
}

.close-btn:hover {
  color: red;
}

/* INPUT */
input {
  background: #0f172a !important;
  color: white !important;
  border: 1px solid #334155 !important;
}

/* BUTTON */
.btn-main {
  background: #3b82f6;
  border: none;
}

.btn-main:hover {
  background: #2563eb;
}
</style>
</head>

<body>

<div class="modal-bg">

  <div class="form-box">

    <!-- X BUTTON -->
    <a href="index.html" class="close-btn">✖</a>

    <h4 class="text-center mb-3">Login</h4>

    <input type="email" id="email" class="form-control mb-2" placeholder="Email">
    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-main w-100" onclick="login()">Login</button>

    <p class="text-center mt-3" style="font-size:12px;">
      Don't have an account?
      <a href="register.html" style="color:#3b82f6;">Register</a>
    </p>

  </div>

</div>

<!-- CONFIG -->
<script src="config.js"></script>

<script>
async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(!email || !password){
    alert("Please fill all fields");
    return;
  }

  // LOGIN
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    alert(error.message);
    return;
  }

  alert("Login successful!");

  // REDIRECT AFTER LOGIN
  window.location.href = "index.html";
}
</script>

</body>
</html>
